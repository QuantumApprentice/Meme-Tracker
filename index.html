<!doctype html>
<html lang="en" data-color-mode="auto" data-dark-theme="dark">
  <head>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Tracker</title>
    <style type="text/css">
      :root {
        color-scheme: light dark;
      }
      #base {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }


      .text {
        width: min(300px, 30vw);
      }
      video, img {
        object-position: top;
        object-fit: cover;
        max-height: 400px;
        max-width: 300px;
        min-width: 0;
        height: auto;
        width: min(300px, 30vw);
      }
      .clipboard {
        max-width: 20px;
        filter: invert(1);
        transform: scaleX(-1) translateY(5px);
      }
      .invisible {
        /* opacity: 0; */
        visibility: hidden;
      }
      .audio_icon {
        z-index: 1;
        cursor: pointer;
        position: absolute;
        transform: scale(.3);
        filter: invert(1);
      }
      .volume {
        position: absolute;
        writing-mode: vertical-rl;
        rotate: 180deg;

        inset: 8px 8px 8px auto;
      }
      .meme {
        outline: solid red;
        position: relative;
        display: flex;
        flex-direction: column;
        max-width: 300px;
        font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        /* justify-content: space-between; */
      }
      .overlay {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        /* opacity: 0; */
        transition: opacity .3s ease;
        outline: solid blue;
        width: 100%;
        /* height: 100%; */
      }
      .overlay:hover {
        opacity: 1;
        position: relative;
        /* filter: invert(1); */
      }
      button {
        z-index: 1;
        cursor: pointer;
        max-width: 300px;
        /* width: min(300px, 30vw); */
        font-size: large;
        white-space: normal;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div id="base"></div>
    <script src="src/meme_tracker.js"></script>
     <!-- <script src="src/canvas.js"></script> -->
  </body>
</html>
